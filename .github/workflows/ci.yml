name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  DOCKER_BUILDKIT: 1

jobs:
  # 前端检查
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 1

  # 后端检查
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend ESLint
        run: |
          cd backend
          npm run lint

      - name: Run backend TypeScript type check
        run: |
          cd backend
          npm run type-check

      - name: Build backend
        run: |
          cd backend
          npm run build

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist/
          retention-days: 1

  # Docker 构建测试
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: smart-wallet-dashboard-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: smart-wallet-dashboard-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 数据库迁移测试
  database-test:
    name: Database Migration Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smart_wallet_dashboard_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate

      - name: Run database migrations
        run: |
          cd backend
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/smart_wallet_dashboard_test

      - name: Test database connection
        run: |
          cd backend
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient({
            datasources: { db: { url: 'postgresql://test_user:test_password@localhost:5432/smart_wallet_dashboard_test' } }
          });
          prisma.\$connect().then(() => {
            console.log('Database connection successful');
            process.exit(0);
          }).catch((err) => {
            console.error('Database connection failed:', err);
            process.exit(1);
          });
          "

  # Docker 集成测试
  docker-integration-test:
    name: Docker Integration Test
    runs-on: ubuntu-latest
    needs: [docker-build, database-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create environment file
        run: |
          echo "ETHERSCAN_API_KEY=test_key" >> .env.test
          echo "DATABASE_URL=postgresql://username:password@postgres:5432/smart_wallet_dashboard" >> .env.test
          echo "REDIS_URL=redis://redis:6379" >> .env.test
          echo "CORS_ORIGIN=http://localhost:3000" >> .env.test

      - name: Start services with Docker Compose
        run: |
          docker-compose -f docker-compose.yml --env-file .env.test up -d --build

      - name: Wait for services to be ready
        run: |
          timeout 300 bash -c 'until docker-compose -f docker-compose.yml ps | grep -q "healthy"; do sleep 5; done'

      - name: Test service health
        run: |
          # Test frontend health
          curl -f http://localhost:3000 || exit 1

          # Test backend health
          curl -f http://localhost:3001/health || exit 1

          # Test database connection
          docker-compose -f docker-compose.yml exec -T postgres pg_isready -U username -d smart_wallet_dashboard || exit 1

          # Test Redis connection
          docker-compose -f docker-compose.yml exec -T redis redis-cli ping || exit 1

      - name: Test API endpoints
        run: |
          # Test API endpoints
          curl -f http://localhost:3001/api/favorites || exit 1

      - name: Stop services
        if: always()
        run: |
          docker-compose -f docker-compose.yml down -v

  # 安全扫描
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # 代码质量检查
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=smart-wallet-dashboard
            -Dsonar.organization=your-org
            -Dsonar.sources=src,backend/src
            -Dsonar.host.url=https://sonarcloud.io
