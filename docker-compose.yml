version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smart-wallet-postgres
    environment:
      POSTGRES_DB: smart_wallet_dashboard
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart-wallet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d smart_wallet_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smart-wallet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smart-wallet-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend BFF Service
  bff:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-wallet-bff
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://username:password@postgres:5432/smart_wallet_dashboard
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
      - ETHERSCAN_BASE_URL=https://api.etherscan.io/v2/api
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smart-wallet-network
    restart: unless-stopped

  # Frontend Next.js App
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-wallet-web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - bff
    networks:
      - smart-wallet-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  smart-wallet-network:
    driver: bridge
